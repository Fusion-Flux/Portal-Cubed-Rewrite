[versions]
# remember to keep this in sync with minecraft_dependency in gradle.properties
minecraft = "26.3-rc-2"

# https://fabricmc.net/develop/
fabric-loader = "0.19.5"
fabric-api = "0.160.4+26.3"
fabric-loom = "1.17.+"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

[bundles]
fabric = [ "fabric-loader", "fabric-api" ]

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
build-logic = { id = "io.github.fusionflux.portalcubed.build-logic" }
